name: Atualizar indicadores

on:
  schedule:
    # 10:00 UTC = 07:00 em Brasília (horário padrão, sem horário de verão)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar indicadores no Banco Central
        run: node scripts/fetch-data.js

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "chore: atualizar indicadores $(date -u +%Y-%m-%d)"
            git push
          fi
